<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D2023">
<title>Kalkulator prędkości skrawania i posuwu</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1 id="title">Prędkość skrawania</h1>
    <span class="sym" id="sym">Vc</span>
  </div>

  <div class="unit-toggle">
    <div class="group">
      <button id="btn-mm" class="active" onclick="setUnits('metric')">mm</button>
      <button id="btn-in" onclick="setUnits('imperial')">cale</button>
    </div>
  </div>

  <div class="mode-switch">
    <button id="btn-vc" class="active" onclick="setMode('vc')">Oblicz Vc</button>
    <button id="btn-n" onclick="setMode('n')">Oblicz n</button>
    <button id="btn-vf" onclick="setMode('vf')">Oblicz posuw</button>
  </div>

  <div class="sub-switch" id="vf-sub" style="display:none;">
    <button id="btn-mill" class="active" onclick="setFeedType('mill')">Frezowanie</button>
    <button id="btn-turn" onclick="setFeedType('turn')">Toczenie / wiercenie</button>
  </div>

  <div class="sub-switch dir" id="vf-dir" style="display:none;">
    <button id="btn-fwd" class="active" onclick="setFeedDir('forward')">Oblicz Vf</button>
    <button id="btn-rev" onclick="setFeedDir('reverse')">Oblicz posuw z Vf</button>
  </div>

  <div class="panel">
    <div class="field" id="field-D">
      <label for="D"><span>Średnica narzędzia / przedmiotu</span><span class="unit" id="unit-D">D [mm]</span></label>
      <input type="number" id="D" value="20" step="0.1" min="0" oninput="calc()">
    </div>
    <div class="field" id="field-n">
      <label for="n"><span>Prędkość obrotowa</span><span class="unit">n [obr/min]</span></label>
      <input type="number" id="n" value="1200" step="1" min="0" oninput="calc()">
    </div>
    <div class="field" id="field-vc" style="display:none;">
      <label for="vc"><span>Prędkość skrawania</span><span class="unit" id="unit-vc">Vc [m/min]</span></label>
      <input type="number" id="vc" value="75" step="0.5" min="0" oninput="calc()">
    </div>
    <div class="field" id="field-fz" style="display:none;">
      <label for="fz"><span>Posuw na ząb</span><span class="unit" id="unit-fz">fz [mm/ząb]</span></label>
      <input type="number" id="fz" value="0.08" step="0.01" min="0" oninput="calc()">
    </div>
    <div class="field" id="field-z" style="display:none;">
      <label for="z"><span>Liczba ostrzy (zębów)</span><span class="unit">z [-]</span></label>
      <input type="number" id="z" value="4" step="1" min="1" oninput="calc()">
    </div>
    <div class="field" id="field-f" style="display:none;">
      <label for="f"><span>Posuw na obrót</span><span class="unit" id="unit-f">f [mm/obr]</span></label>
      <input type="number" id="f" value="0.15" step="0.01" min="0" oninput="calc()">
    </div>
    <div class="field" id="field-vfinput" style="display:none;">
      <label for="vfinput"><span id="vfinput-label">Prędkość posuwu</span><span class="unit" id="unit-vfinput">Vf [mm/min]</span></label>
      <input type="number" id="vfinput" value="400" step="1" min="0" oninput="calc()">
    </div>
  </div>

  <div class="readout">
    <span class="rlabel" id="rlabel">Prędkość skrawania</span>
    <span><span class="rvalue" id="rvalue">0</span><span class="runit" id="runit">m/min</span></span>
  </div>

  <div class="formula" id="formula">Vc = (π × D × n) / 1000</div>

  <details class="ref">
    <summary>Orientacyjne wartości Vc dla toczenia [m/min]</summary>
    <table>
      <tr><td>Stal konstrukcyjna (C45)</td><td>120–180</td></tr>
      <tr><td>Stal nierdzewna</td><td>80–150</td></tr>
      <tr><td>Żeliwo szare</td><td>70–120</td></tr>
      <tr><td>Aluminium</td><td>200–500</td></tr>
      <tr><td>Mosiądz / brąz</td><td>150–300</td></tr>
      <tr><td>Tytan</td><td>30–60</td></tr>
    </table>
  </details>

</div>

<script src="js/app.js" defer></script>
</body>
</html>
