<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Kalkulator prędkości skrawania i posuwu</title>
<style>
  :root{
    --bg: #1D2023;
    --panel: #26292D;
    --panel-2: #2E3236;
    --line: #3A3E42;
    --text: #ECEDEE;
    --text-dim: #9BA1A6;
    --accent: #E8621D;
    --accent-dim: #7A3D1C;
    --mono: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    padding: 40px 24px;
    font-size: 17px;
    display:flex;
    justify-content:center;
  }
  .wrap{ width:100%; max-width: 700px; }

  .header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
  }
  .header h1{
    font-size: 27px;
    font-weight: 600;
    margin:0;
    letter-spacing: 0.2px;
  }
  .header .sym{
    font-family: var(--mono);
    color: var(--accent);
    font-size: 20px;
  }

  .unit-toggle{
    display:flex;
    justify-content:flex-end;
    margin-bottom: 14px;
  }
  .unit-toggle .group{
    display:flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 3px;
  }
  .unit-toggle button{
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 10px 22px;
    border-radius: 6px;
    font-size: 15px;
    font-family: var(--mono);
    cursor:pointer;
  }
  .unit-toggle button.active{
    background: var(--accent);
    color: #1D2023;
    font-weight: 600;
  }

  .mode-switch{
    display:flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 14px;
  }
  .mode-switch button{
    flex:1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 14px 10px;
    border-radius: 7px;
    font-size: 16px;
    font-family: var(--sans);
    cursor:pointer;
    transition: background .15s, color .15s;
  }
  .mode-switch button.active{
    background: var(--accent);
    color: #1D2023;
    font-weight: 600;
  }

  .sub-switch{
    display:flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .sub-switch button{
    flex:1;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 12px 8px;
    border-radius: 8px;
    font-size: 15px;
    font-family: var(--sans);
    cursor:pointer;
  }
  .sub-switch button.active{
    border-color: var(--accent);
    color: var(--accent);
  }
  .sub-switch.dir{ margin-bottom: 16px; }

  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 20px;
  }

  .field{ margin-bottom: 22px; }
  .field:last-child{ margin-bottom: 0; }
  .field label{
    display:flex;
    justify-content:space-between;
    font-size: 14.5px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .field label .unit{ color: var(--text-dim); font-family: var(--mono); }
  .field input{
    width:100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--mono);
    font-size: 23px;
    padding: 14px 16px;
    border-radius: 8px;
    outline:none;
  }
  .field input:focus{ border-color: var(--accent); }

  .readout{
    background: var(--panel-2);
    border: 1px solid var(--accent-dim);
    border-radius: 12px;
    padding: 26px 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .readout .rlabel{
    font-size: 15.5px;
    color: var(--text-dim);
  }
  .readout .rvalue{
    font-family: var(--mono);
    font-size: 44px;
    color: var(--accent);
    font-weight: 600;
  }
  .readout .runit{
    font-family: var(--mono);
    font-size: 17px;
    color: var(--text-dim);
    margin-left: 8px;
  }

  .formula{
    font-family: var(--mono);
    font-size: 15px;
    color: var(--text-dim);
    text-align:center;
    margin: 18px 0 0;
  }

  .ref{
    margin-top: 18px;
  }
  .ref summary{
    cursor:pointer;
    font-size: 15px;
    color: var(--text-dim);
    padding: 6px 0;
  }
  .ref table{
    width:100%;
    border-collapse: collapse;
    margin-top: 12px;
    font-size: 15px;
  }
  .ref td{
    padding: 10px 6px;
    border-bottom: 1px solid var(--line);
  }
  .ref td:first-child{ color: var(--text); }
  .ref td:last-child{
    text-align:right;
    font-family: var(--mono);
    color: var(--accent);
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1 id="title">Prędkość skrawania</h1>
    <span class="sym" id="sym">Vc</span>
  </div>

  <div class="unit-toggle">
    <div class="group">
      <button id="btn-mm" class="active" onclick="setUnits('metric')">mm</button>
      <button id="btn-in" onclick="setUnits('imperial')">cale</button>
    </div>
  </div>

  <div class="mode-switch">
    <button id="btn-vc" class="active" onclick="setMode('vc')">Oblicz Vc</button>
    <button id="btn-n" onclick="setMode('n')">Oblicz n</button>
    <button id="btn-vf" onclick="setMode('vf')">Oblicz posuw</button>
  </div>

  <div class="sub-switch" id="vf-sub" style="display:none;">
    <button id="btn-mill" class="active" onclick="setFeedType('mill')">Frezowanie</button>
    <button id="btn-turn" onclick="setFeedType('turn')">Toczenie / wiercenie</button>
  </div>

  <div class="sub-switch dir" id="vf-dir" style="display:none;">
    <button id="btn-fwd" class="active" onclick="setFeedDir('forward')">Oblicz Vf</button>
    <button id="btn-rev" onclick="setFeedDir('reverse')">Oblicz posuw z Vf</button>
  </div>

  <div class="panel">
    <div class="field" id="field-D">
      <label><span>Średnica narzędzia / przedmiotu</span><span class="unit" id="unit-D">D [mm]</span></label>
      <input type="number" id="D" value="20" step="0.1" min="0" oninput="calc()">
    </div>
    <div class="field" id="field-n">
      <label><span>Prędkość obrotowa</span><span class="unit">n [obr/min]</span></label>
      <input type="number" id="n" value="1200" step="1" min="0" oninput="calc()">
    </div>
    <div class="field" id="field-vc" style="display:none;">
      <label><span>Prędkość skrawania</span><span class="unit" id="unit-vc">Vc [m/min]</span></label>
      <input type="number" id="vc" value="75" step="0.5" min="0" oninput="calc()">
    </div>
    <div class="field" id="field-fz" style="display:none;">
      <label><span>Posuw na ząb</span><span class="unit" id="unit-fz">fz [mm/ząb]</span></label>
      <input type="number" id="fz" value="0.08" step="0.01" min="0" oninput="calc()">
    </div>
    <div class="field" id="field-z" style="display:none;">
      <label><span>Liczba ostrzy (zębów)</span><span class="unit">z [-]</span></label>
      <input type="number" id="z" value="4" step="1" min="1" oninput="calc()">
    </div>
    <div class="field" id="field-f" style="display:none;">
      <label><span>Posuw na obrót</span><span class="unit" id="unit-f">f [mm/obr]</span></label>
      <input type="number" id="f" value="0.15" step="0.01" min="0" oninput="calc()">
    </div>
    <div class="field" id="field-vfinput" style="display:none;">
      <label><span id="vfinput-label">Prędkość posuwu</span><span class="unit" id="unit-vfinput">Vf [mm/min]</span></label>
      <input type="number" id="vfinput" value="400" step="1" min="0" oninput="calc()">
    </div>
  </div>

  <div class="readout">
    <span class="rlabel" id="rlabel">Prędkość skrawania</span>
    <span><span class="rvalue" id="rvalue">0</span><span class="runit" id="runit">m/min</span></span>
  </div>

  <div class="formula" id="formula">Vc = (π × D × n) / 1000</div>

  <details class="ref">
    <summary>Orientacyjne wartości Vc dla toczenia [m/min]</summary>
    <table>
      <tr><td>Stal konstrukcyjna (C45)</td><td>120–180</td></tr>
      <tr><td>Stal nierdzewna</td><td>80–150</td></tr>
      <tr><td>Żeliwo szare</td><td>70–120</td></tr>
      <tr><td>Aluminium</td><td>200–500</td></tr>
      <tr><td>Mosiądz / brąz</td><td>150–300</td></tr>
      <tr><td>Tytan</td><td>30–60</td></tr>
    </table>
  </details>

</div>

<script>
let mode = 'vc';        // 'vc' | 'n' | 'vf'
let feedType = 'mill';  // 'mill' | 'turn'  — tylko dla mode === 'vf'
let feedDir = 'forward';// 'forward' (liczy Vf) | 'reverse' (liczy fz / f z Vf)
let units = 'metric';   // 'metric' | 'imperial'

const MM_PER_IN = 25.4;
const FTMIN_PER_MMIN = 3.280839895 / 1000; // m/min -> ft/min: *3.28084 ; tu liczymy z mm ostrożnie osobno

const UNIT_LABELS = {
  metric:  { len: 'mm',  vc: 'm/min',  vf: 'mm/min', fzu: 'mm/ząb', fu: 'mm/obr', vcDivisor: 1000 },
  imperial:{ len: 'cal', vc: 'ft/min', vf: 'cal/min', fzu: 'cal/ząb', fu: 'cal/obr', vcDivisor: 12 }
};

function setUnits(u){
  if(u === units) return;
  const goingImperial = (u === 'imperial');

  // konwersja aktualnych wartości w polach, żeby liczby dalej miały fizyczny sens
  convertField('D', goingImperial ? (v => v / MM_PER_IN) : (v => v * MM_PER_IN), goingImperial ? 3 : 2);
  convertField('vc', goingImperial ? (v => v * 3.280839895) : (v => v / 3.280839895), 2);
  convertField('fz', goingImperial ? (v => v / MM_PER_IN) : (v => v * MM_PER_IN), goingImperial ? 5 : 3);
  convertField('f', goingImperial ? (v => v / MM_PER_IN) : (v => v * MM_PER_IN), goingImperial ? 5 : 3);
  convertField('vfinput', goingImperial ? (v => v / MM_PER_IN) : (v => v * MM_PER_IN), goingImperial ? 3 : 1);

  units = u;
  document.getElementById('btn-mm').classList.toggle('active', u==='metric');
  document.getElementById('btn-in').classList.toggle('active', u==='imperial');

  refreshUnitLabels();
  calc();
}

function convertField(id, fn, decimals){
  const el = document.getElementById(id);
  const val = parseFloat(el.value);
  if(!isNaN(val)){
    el.value = parseFloat(fn(val).toFixed(decimals));
  }
}

function refreshUnitLabels(){
  const u = UNIT_LABELS[units];
  document.getElementById('unit-D').textContent = 'D [' + u.len + ']';
  document.getElementById('unit-vc').textContent = 'Vc [' + u.vc + ']';
  document.getElementById('unit-fz').textContent = 'fz [' + u.fzu + ']';
  document.getElementById('unit-f').textContent = 'f [' + u.fu + ']';

  if(mode === 'vf' && feedDir === 'reverse'){
    document.getElementById('unit-vfinput').textContent = 'Vf [' + u.vf + ']';
  } else {
    document.getElementById('unit-vfinput').textContent = 'Vf [' + u.vf + ']';
  }

  // odśwież etykiety odczytu zależnie od aktualnego trybu
  if(mode === 'vc'){
    document.getElementById('runit').textContent = u.vc;
  } else if(mode === 'vf'){
    updateFeedFields(false);
  }
}

function setMode(m){
  mode = m;
  document.getElementById('btn-vc').classList.toggle('active', m==='vc');
  document.getElementById('btn-n').classList.toggle('active', m==='n');
  document.getElementById('btn-vf').classList.toggle('active', m==='vf');

  document.getElementById('vf-sub').style.display = (m==='vf') ? 'flex' : 'none';
  document.getElementById('vf-dir').style.display = (m==='vf') ? 'flex' : 'none';
  document.getElementById('field-D').style.display = (m==='vf') ? 'none' : 'block';
  document.getElementById('field-vc').style.display = (m==='n') ? 'block' : 'none';
  document.getElementById('field-n').style.display = (m==='vc' || m==='vf') ? 'block' : 'none';

  document.getElementById('title').textContent =
    (m==='vf') ? 'Posuw' : 'Prędkość skrawania';
  document.getElementById('sym').textContent = (m==='vf') ? 'Vf / f' : 'Vc';

  const u = UNIT_LABELS[units];

  if(m==='vf'){
    setFeedType(feedType);
  } else {
    document.getElementById('field-fz').style.display = 'none';
    document.getElementById('field-z').style.display = 'none';
    document.getElementById('field-f').style.display = 'none';
    document.getElementById('field-vfinput').style.display = 'none';
    document.getElementById('rlabel').textContent = (m==='vc') ? 'Prędkość skrawania' : 'Prędkość obrotowa';
    document.getElementById('runit').textContent = (m==='vc') ? u.vc : 'obr/min';
    document.getElementById('formula').textContent = (m==='vc')
      ? 'Vc = (π × D × n) / ' + u.vcDivisor
      : 'n = (Vc × ' + u.vcDivisor + ') / (π × D)';
  }
  calc();
}

function setFeedType(t){
  feedType = t;
  document.getElementById('btn-mill').classList.toggle('active', t==='mill');
  document.getElementById('btn-turn').classList.toggle('active', t==='turn');
  document.getElementById('btn-rev').textContent = (t==='mill') ? 'Oblicz fz z Vf' : 'Oblicz f z Vf';
  updateFeedFields();
}

function setFeedDir(d){
  feedDir = d;
  document.getElementById('btn-fwd').classList.toggle('active', d==='forward');
  document.getElementById('btn-rev').classList.toggle('active', d==='reverse');
  updateFeedFields();
}

function updateFeedFields(doCalc){
  if(doCalc === undefined) doCalc = true;
  const u = UNIT_LABELS[units];
  const mill = feedType === 'mill';
  const fwd = feedDir === 'forward';

  document.getElementById('field-z').style.display = mill ? 'block' : 'none';
  document.getElementById('field-fz').style.display = (mill && fwd) ? 'block' : 'none';
  document.getElementById('field-f').style.display = (!mill && fwd) ? 'block' : 'none';
  document.getElementById('field-vfinput').style.display = (!fwd) ? 'block' : 'none';

  if(fwd){
    document.getElementById('rlabel').textContent = 'Prędkość posuwu';
    document.getElementById('runit').textContent = u.vf;
    document.getElementById('formula').textContent = mill
      ? 'Vf = fz × z × n'
      : 'Vf = f × n';
  } else if(mill){
    document.getElementById('rlabel').textContent = 'Posuw na ząb';
    document.getElementById('runit').textContent = u.fzu;
    document.getElementById('formula').textContent = 'fz = Vf / (z × n)';
  } else {
    document.getElementById('rlabel').textContent = 'Posuw na obrót';
    document.getElementById('runit').textContent = u.fu;
    document.getElementById('formula').textContent = 'f = Vf / n';
  }
  if(doCalc) calc();
}

function calc(){
  const u = UNIT_LABELS[units];
  const D = parseFloat(document.getElementById('D').value) || 0;
  const n = parseFloat(document.getElementById('n').value) || 0;
  let result = 0;
  let decimals = 1;

  if(mode === 'vc'){
    result = (Math.PI * D * n) / u.vcDivisor;
    decimals = 2;
  } else if(mode === 'n'){
    const vc = parseFloat(document.getElementById('vc').value) || 0;
    result = D > 0 ? (vc * u.vcDivisor) / (Math.PI * D) : 0;
    decimals = 0;
  } else if(mode === 'vf'){
    const mill = feedType === 'mill';
    const fwd = feedDir === 'forward';

    if(fwd){
      if(mill){
        const fz = parseFloat(document.getElementById('fz').value) || 0;
        const z = parseFloat(document.getElementById('z').value) || 0;
        result = fz * z * n;
      } else {
        const f = parseFloat(document.getElementById('f').value) || 0;
        result = f * n;
      }
      decimals = (units === 'imperial') ? 3 : 0;
    } else {
      const vf = parseFloat(document.getElementById('vfinput').value) || 0;
      if(mill){
        const z = parseFloat(document.getElementById('z').value) || 0;
        result = (n > 0 && z > 0) ? vf / (n * z) : 0;
      } else {
        result = n > 0 ? vf / n : 0;
      }
      decimals = (units === 'imperial') ? 5 : 3;
    }
  }

  document.getElementById('rvalue').textContent =
    result.toLocaleString('pl-PL', {maximumFractionDigits: decimals});
}

calc();
</script>
</body>
</html>
